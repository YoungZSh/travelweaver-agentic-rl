# TravelWeaver overrides for veRL's sft_trainer_engine data section.
train_files: data/sft/chinatravel-qwen3.5-4b-action-633-sft-v2-natural/all.parquet
val_files: null
train_batch_size: 16
micro_batch_size_per_gpu: 1
max_token_len_per_gpu: 16384
use_dynamic_bsz: true
messages_key: messages_json
tools_key: tools_json
enable_thinking_key: enable_thinking
enable_thinking_default: false
pad_mode: no_padding
max_length: 32768
truncation: error
shuffle: false
apply_chat_template_kwargs:
  enable_thinking: false
custom_cls:
  path: training/src/travelweaver_sft_dataset.py
  name: TravelWeaverMultiTurnSFTDataset
ignore_input_ids_mismatch: false
num_workers: 4
